# SonarQube Cloud (sonarcloud.io), run by .github/workflows/ci.yml.
sonar.projectKey=hamzaamry_hevier
sonar.organization=hamzaamry
sonar.projectName=Hevier
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages
sonar.exclusions=**/*.test.ts,node_modules/**,**/node_modules/**,coverage/**,apps/mobile/android/**,packages/catalogue/**,apps/mobile/assets/**,apps/mobile/scripts/local/**,**/.expo/**,**/.turbo/**,**/build/**
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts
sonar.test.exclusions=node_modules/**,**/node_modules/**,apps/mobile/scripts/local/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Screens, components, hooks and the native modules have no unit tests (no UI
# test setup), so they don't count towards coverage. They are still analysed.
sonar.coverage.exclusions=apps/mobile/app/**,apps/mobile/components/**,apps/mobile/hooks/**,apps/mobile/modules/**,apps/mobile/types/**,**/*.d.ts,apps/mobile/plugins/**,apps/mobile/scripts/design/**,apps/mobile/scripts/widgets/**,apps/mobile/scripts/build-hevy-names.ts,**/*.config.*,packages/config-*/**
