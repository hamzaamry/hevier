name: Release APK

# Phone install for #55. The build and signing steps are the release half of
# PR #35 (android.yml + the publish job in release.yml). Left out on purpose:
# a debug APK on every pull request, release-please, sync binaries, the
# landing page, CodeQL and the other scans. Those stay on #35.
#
# A tag vX.Y.Z builds the signed release APK and publishes the GitHub Release.
# The same keystore has to sign every release, or an update will not install
# over the old app. Without the ANDROID_KEYSTORE_* secrets the release stays
# a draft, signed with the debug key.
#
# To rebuild a tag: gh workflow run release-apk.yml --ref v1.2.3
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: apk (release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Find the NDK React Native wants
        id: ndk
        run: |
          version=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' apps/mobile/node_modules/react-native/gradle/libs.versions.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Cache the NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ndk.outputs.dir }}
          key: android-ndk-${{ steps.ndk.outputs.version }}

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "::error::Run this workflow from a vX.Y.Z tag."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          IFS=. read -r major minor patch <<< "${version%%[-+]*}"
          code=$((major * 1000000 + minor * 1000 + patch))
          jq --arg v "$version" --argjson c "$code" \
            '.expo.version = $v | .expo.android.versionCode = $c' apps/mobile/app.json > "$RUNNER_TEMP/app.json"
          mv "$RUNNER_TEMP/app.json" apps/mobile/app.json
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version, versionCode $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # withHevierRelease signs the release build with the key described in
      # ~/.config/hevier/keystore.properties, or with the debug key without it.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The signing secrets are not set: the release APK is signed with the debug key."
            echo "### Not signed with the release key" >> "$GITHUB_STEP_SUMMARY"
            echo "The ANDROID_KEYSTORE_* and ANDROID_KEY_* secrets are missing. The APK is signed with the debug key: it cannot update an app signed with the release key." >> "$GITHUB_STEP_SUMMARY"
          else
            dir="$HOME/.config/hevier"
            mkdir -p "$dir"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
            {
              echo "storeFile=$dir/release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$dir/keystore.properties"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        working-directory: apps/mobile/android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          tasks=(assembleRelease)
          args=(-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g")
          [ "$SIGNED" = true ] && tasks+=(bundleRelease)
          ./gradlew "${tasks[@]}" "${args[@]}"

      - name: Collect
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NAME: hevier-${{ steps.version.outputs.name }}
        run: |
          out=apps/mobile/android/app/build/outputs
          mkdir -p dist
          if [ "$SIGNED" = true ]; then
            cp "$out/apk/release/app-release.apk" "dist/$NAME.apk"
            cp "$out/bundle/release/app-release.aab" "dist/$NAME.aab"
          else
            cp "$out/apk/release/app-release.apk" "dist/$NAME-debug-key.apk"
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            if [ "$SIGNED" = true ] && grep -q 'CN=Android Debug' <<< "$certs"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            {
              echo "### $(basename "$apk") ($(du -h "$apk" | cut -f1))"
              grep 'certificate SHA-256' <<< "$certs"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: dist

      - name: Publish
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/*
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG"
          fi
          if [ "$SIGNED" = true ]; then
            gh release edit "$TAG" --draft=false --latest
            echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$TAG stays a draft: the APK is not signed with the release key."
            echo "$TAG is a draft. Set the ANDROID_KEYSTORE_* secrets and run Release APK again from this tag." >> "$GITHUB_STEP_SUMMARY"
          fi
