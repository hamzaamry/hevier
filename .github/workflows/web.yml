name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Regenerate the screenshot baselines on linux and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  e2e:
    name: web (build, e2e, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**') }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter @hevier/web build

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @hevier/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        run: pnpm --filter @hevier/web exec playwright install --with-deps chromium

      # Everything but the screenshot comparison: a failure here fails the check.
      - name: e2e and axe
        if: ${{ !inputs.update-baselines }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/e2e
        run: pnpm --filter @hevier/web e2e '^((?!visual).)*$' --reporter=list,html

      # The committed baselines come from macOS, so on linux this only warns until
      # the baselines from the "update-baselines" run are committed and the
      # repository variable WEB_VISUAL_BLOCKING is set to true.
      - name: Screenshots
        id: visual
        if: ${{ !inputs.update-baselines }}
        continue-on-error: ${{ vars.WEB_VISUAL_BLOCKING != 'true' }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/visual
        run: pnpm --filter @hevier/web e2e visual --reporter=list,html --output=test-results/visual

      - name: Screenshots differ
        if: ${{ !inputs.update-baselines && steps.visual.outcome == 'failure' }}
        run: |
          echo "::warning::The screenshots differ from the committed baselines (not blocking). See docs/ci.md to regenerate them on linux."
          echo "The screenshot tests failed but are not blocking: the committed baselines were made on macOS." >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the baselines
        if: ${{ inputs.update-baselines }}
        run: pnpm --filter @hevier/web e2e --update-snapshots=all visual

      - name: Upload the baselines
        if: ${{ inputs.update-baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-baselines-linux
          path: apps/web/e2e/__screenshots__
          retention-days: 14
          if-no-files-found: error

      - name: Upload the reports
        if: ${{ !cancelled() && !inputs.update-baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
