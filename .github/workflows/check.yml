# Types, lint and tests on every push to main and every pull request (one
# `turbo run check` over all packages); then coverage and a Sonar scan when the
# SONAR_TOKEN secret is set. The commit message is checked too: release.yml
# reads it to pick the next version.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # release.yml reads the commit message to pick the next version
  # (scripts/next-version.mjs), so a message without a type would skip the
  # release without anyone noticing. Squash merges use the pull request title
  # as the commit, so the title is what gets checked before merge.
  messages:
    name: Commit message
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          SUBJECT: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|refactor|docs|test|build|ci|chore|style)(\([^)]+\))?!?: .+'
          if [[ "$SUBJECT" =~ $pattern ]] || [[ "$SUBJECT" == Revert\ \"*\" ]]; then
            echo "$SUBJECT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The pull request title must look like 'feat(workout): add a rest timer'."
          {
            echo "### The title sets the release"
            echo
            echo "Types: feat, fix, perf, revert, refactor, docs, test, build, ci, chore, style."
            echo "A '!' before the colon, or a BREAKING CHANGE line, makes it a major release."
            echo "See CONTRIBUTING.md -> Releases."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Commits
        if: github.event_name == 'push'
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          pattern='^(feat|fix|perf|revert|refactor|docs|test|build|ci|chore|style)(\([^)]+\))?!?: .+'
          failed=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            [[ "$subject" == Merge\ * ]] && continue
            [[ "$subject" == Revert\ \"*\" ]] && continue
            [[ "$subject" =~ $pattern ]] && continue
            echo "::error::This commit message does not follow the release rules: $subject"
            failed=1
          done < <(jq -r '.[].message | split("\n")[0]' <<< "$COMMITS")
          if [ "$failed" != 0 ]; then
            echo "See CONTRIBUTING.md -> Releases for the types and what they bump." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Sonar needs the history to tell new code from old

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Expo writes expo-env.d.ts and the typed-routes file (.expo/types/router.d.ts)
      # when its dev server starts; the type check needs both. Start it, wait
      # for the file, stop it.
      - name: Generate Expo types
        working-directory: apps/mobile
        run: |
          CI=1 ./node_modules/.bin/expo start --port 8099 > "$RUNNER_TEMP/expo-start.log" 2>&1 &
          for i in $(seq 1 90); do [ -f .expo/types/router.d.ts ] && break; sleep 1; done
          kill $! 2>/dev/null || true
          test -f expo-env.d.ts && test -f .expo/types/router.d.ts || { cat "$RUNNER_TEMP/expo-start.log"; exit 1; }

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Check (types, lint, tests)
        run: pnpm turbo run check --cache-dir=.turbo

      - name: Coverage
        if: env.SONAR_TOKEN != ''
        run: pnpm test:coverage

      - name: Cache Sonar packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
